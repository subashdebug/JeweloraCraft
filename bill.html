<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Your JeweloraCraft Bill</title>
<meta property="og:title" content="Your JeweloraCraft Bill">
<meta property="og:description" content="Open to see your bill and download the PDF.">
<meta name="theme-color" content="#241c1f">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #241c1f; --muted: #6b5e53; --tag: #755822; --teal: #0f6e6e; --maroon: #6c1e3c;
    --code: #ababab; --rule: #e6dcc6; --row: #f1eada; --foot: #464038; --bg: #f2eee5;
    --serif: "Fraunces", Georgia, "Times New Roman", serif;
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Consolas, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: var(--sans); color: var(--ink); background: var(--bg); min-height: 100vh; padding: 28px 16px 44px; -webkit-text-size-adjust: 100%; }
  .wrap { max-width: 760px; margin: 0 auto; }

  /* the invoice sheet - same layout as the PDF bill */
  .sheet { background: #fff; border-radius: 10px; padding: 40px 44px 34px; box-shadow: 0 10px 34px rgba(60, 45, 20, .09); }
  .brand { font-family: var(--serif); font-weight: 600; font-size: 1.32rem; line-height: 1.1; letter-spacing: .005em; }
  .tag { font-family: var(--serif); font-weight: 700; font-size: .6rem; letter-spacing: .2em; text-transform: uppercase; color: var(--tag); margin-top: 6px; }
  .meta { margin-top: 20px; font-size: .84rem; color: var(--muted); line-height: 1.6; }
  .meta .no { font-family: var(--mono); font-weight: 700; color: var(--ink); font-size: .84rem; }
  .perf { margin: 12px 0 26px; border-top: 3px dotted #e8e6e1; }
  .client { font-family: var(--serif); font-weight: 600; font-size: 1.6rem; line-height: 1.15; margin: 0; }
  .contact { font-size: .78rem; color: var(--muted); margin-top: 6px; line-height: 1.5; }

  table { width: 100%; border-collapse: collapse; margin-top: 30px; }
  th { font-family: var(--mono); font-weight: 700; font-size: .66rem; letter-spacing: .12em; text-transform: uppercase; text-align: left; padding: 0 6px 10px; border-bottom: 1px solid var(--rule); color: var(--ink); }
  th.c, td.c { text-align: center; } th.r, td.r { text-align: right; }
  th.t { color: var(--teal); }
  td { padding: 14px 6px; border-bottom: 1px solid var(--row); font-size: .86rem; vertical-align: middle; }
  tbody tr:last-child td { border-bottom: 0; }
  .code { display: inline-block; width: 2.6em; margin-right: 6px; font-family: var(--serif); font-weight: 700; font-size: .86rem; color: var(--code); }
  .iname { display: inline-block; vertical-align: middle; }
  .iname small { display: block; font-size: .68rem; color: #8a8378; margin-top: 2px; }
  td.num { font-family: var(--mono); font-size: .8rem; color: var(--teal); white-space: nowrap; }
  td.qty { white-space: nowrap; }

  .totals { border-top: 2px solid var(--ink); margin-top: 8px; padding-top: 12px; }
  .tl { display: flex; justify-content: flex-end; align-items: baseline; gap: 18px; padding: 4px 6px; font-size: .84rem; color: var(--muted); }
  .tl b { font-family: var(--mono); font-weight: 500; color: var(--ink); min-width: 104px; text-align: right; font-size: .82rem; }
  .tl.grand { margin-top: 6px; }
  .tl.grand b { font-family: var(--serif); font-weight: 500; font-size: 1.55rem; color: var(--maroon); min-width: 0; }
  .foot { margin-top: 30px; padding-top: 16px; border-top: 1px solid var(--rule); display: flex; justify-content: center; gap: 18px; flex-wrap: wrap; font-family: var(--serif); font-weight: 600; font-size: .82rem; color: #464038; }

  .dl { appearance: none; border: 0; cursor: pointer; width: 100%; margin-top: 18px; min-height: 52px; padding: 14px 18px; border-radius: 10px; background: var(--ink); color: #fff; font: 600 1rem var(--sans); letter-spacing: .01em; transition: background .15s; }
  .dl:hover { background: var(--maroon); }
  .dl:focus-visible { outline: 3px solid var(--tag); outline-offset: 3px; }
  .dl[disabled] { opacity: .65; cursor: progress; }
  .note { margin: 16px 4px 0; font-size: .8rem; line-height: 1.55; color: var(--muted); text-align: center; }
  .err { background: #fff; border-radius: 10px; padding: 40px 24px; text-align: center; box-shadow: 0 10px 34px rgba(60, 45, 20, .09); }
  .err h1 { font-family: var(--serif); font-weight: 600; font-size: 1.4rem; margin: 0 0 8px; }
  .err p { color: var(--muted); margin: 0; line-height: 1.5; }

  @media (max-width: 520px) {
    body { padding: 12px 10px 36px; }
    .sheet { padding: 26px 18px 22px; }
    .code, .col-price { display: none; }
    th, td { padding-left: 3px; padding-right: 3px; }
    td { font-size: .82rem; } td.num { font-size: .74rem; } th { font-size: .6rem; letter-spacing: .06em; }
    .client { font-size: 1.35rem; }
    .tl b { min-width: 86px; } .tl.grand b { font-size: 1.3rem; }
  }
  @media (prefers-reduced-motion: reduce) { .dl { transition: none; } }
</style>
</head>
<body>
<div class="wrap" id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="invoice-pdf.js"></script>
<script>
(function () {
  const root = document.getElementById("root");
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const rs = n => "Rs. " + Number(n || 0).toLocaleString("en-US");

  function fail() {
    root.innerHTML = '<div class="err"><h1>Bill not found</h1><p>This bill link looks incomplete. Please ask JeweloraCraft to send it again on WhatsApp.</p></div>';
  }

  let o;
  try {
    const b64 = location.hash.replace(/^#/, "").replace(/-/g, "+").replace(/_/g, "/");
    if (!b64) return fail();
    const bin = atob(b64 + "=".repeat((4 - (b64.length % 4)) % 4));
    const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
    o = JSON.parse(new TextDecoder().decode(bytes));
    if (!o || !Array.isArray(o.l) || !o.l.length) return fail();
  } catch (e) { return fail(); }

  const inv = {
    invoiceNo: String(o.n || ""),
    date: /^\d{8}$/.test(String(o.d)) ? `${String(o.d).slice(0, 4)}-${String(o.d).slice(4, 6)}-${String(o.d).slice(6, 8)}T12:00:00` : o.d,
    clientName: String(o.c || ""), clientPhone: "", clientAddress: String(o.a || ""),
    lines: o.l.map(r => ({ name: String(r[0] || ""), size: String(r[1] || ""), qty: Number(r[2]) || 1, price: Number(r[3]) || 0 })),
    total: Number(o.t) || 0, delivery: Number(o.v) || 0, discount: Number(o.x) || 0,
  };
  const subtotal = inv.lines.reduce((s, l) => s + l.price * l.qty, 0);
  const dateTxt = pdfFmtDate(inv.date);

  const rows = inv.lines.map(l => `
    <tr>
      <td><span class="code">${esc(pdfItemCode(l.name))}</span><span class="iname">${esc(l.name)}${l.size ? `<small>${esc(/^[\d.\/]+$/.test(l.size)||l.size.length<=2?"Size: "+l.size:l.size)}</small>` : ""}</span></td>
      <td class="c qty">${l.qty} pc</td>
      <td class="r num col-price">${rs(l.price)}</td>
      <td class="r num">${rs(l.price * l.qty)}</td>
    </tr>`).join("");

  root.innerHTML = `
    <div class="sheet">
      <div class="brand">JeweloraCraft</div>
      <div class="tag">Handcrafted Jewellery</div>
      <div class="meta">
        <div>Invoice No.</div>
        <div class="no">${esc(inv.invoiceNo)}</div>
        ${dateTxt ? `<div>Date: ${esc(dateTxt)}</div>` : ""}
      </div>
      <div class="perf"></div>
      <h1 class="client">${esc(inv.clientName)}</h1>
      ${inv.clientAddress ? `<div class="contact">${esc(inv.clientAddress)}</div>` : ""}
      <table>
        <thead><tr><th>Item</th><th class="c">Quantity</th><th class="r t col-price">Price</th><th class="r t">Amount</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="totals">
        <div class="tl"><span>Items Subtotal</span><b>${rs(subtotal)}</b></div>
        ${inv.discount ? `<div class="tl"><span>Discount</span><b>− ${rs(inv.discount)}</b></div>` : ""}
        ${inv.delivery ? `<div class="tl"><span>Delivery Charges</span><b>${rs(inv.delivery)}</b></div>` : ""}
        <div class="tl grand"><span>Total Price</span><b>${rs(inv.total)}</b></div>
      </div>
      <div class="foot"><span>JEWELORACRAFT</span><span>Handcrafted Jewellery</span></div>
    </div>
    <button class="dl" id="dl" type="button">Download PDF</button>
    <p class="note">To confirm your order, please pay the total to the account sent to you in the WhatsApp chat and send us the payment screenshot there.</p>`;

  document.title = "Bill " + inv.invoiceNo + " | JeweloraCraft";

  /* the PDF fonts are big, so load them quietly in the background after the bill is on screen */
  const fontsReady = new Promise(resolve => {
    const s = document.createElement("script");
    s.src = "invoice-fonts.js"; s.onload = () => resolve(true); s.onerror = () => resolve(false);
    setTimeout(() => document.head.appendChild(s), 150);
  });

  document.getElementById("dl").addEventListener("click", async function () {
    const btn = this; btn.disabled = true; const label = btn.textContent; btn.textContent = "Preparing PDF…";
    try {
      await fontsReady;
      if (!window.jspdf) throw new Error("no jspdf");
      buildInvoicePdf(inv).save(inv.invoiceNo + ".pdf");
    } catch (e) { window.print(); }
    setTimeout(() => { btn.disabled = false; btn.textContent = label; }, 900);
  });
})();
</script>
</body>
</html>
