<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — JeweloraCraft</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/x-icon" href="favicon.ico?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0A0A0A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="store-fx.css">
<style>
.co-wrap{max-width:1000px;margin:0 auto;padding:36px 20px 70px}
.co-back{display:inline-block;color:var(--muted);font-size:.9rem;margin-bottom:14px}
.co-back:hover{color:var(--gold)}
.co-title{font-family:"Playfair Display",serif;font-size:2rem;margin-bottom:24px}
.co-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:start}
.co-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:24px}
.co-card h3{font-family:"Playfair Display",serif;font-size:1.2rem;margin-bottom:16px}
.co-card label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:14px}
.co-card input,.co-card textarea{display:block;width:100%;margin-top:6px;padding:12px 14px;background:var(--panel-3);border:1px solid var(--border);border-radius:10px;color:var(--text);font:inherit}
.co-card input:focus,.co-card textarea:focus{outline:none;border-color:var(--gold)}
.co-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.co-item img{width:64px;height:64px;object-fit:cover;border-radius:10px}
.co-item .info{flex:1;font-size:.92rem}
.co-item .sub{color:var(--muted);font-size:.8rem;margin-top:2px}
.co-item .line{font-weight:600;white-space:nowrap}
.co-total{display:flex;justify-content:space-between;font-size:1.15rem;font-weight:600;padding-top:16px}
.co-note{color:var(--muted);font-size:.8rem;margin-top:10px}
.co-empty{text-align:center;padding:60px 20px}
.co-empty h2{font-family:"Playfair Display",serif;margin-bottom:10px}
.co-empty p{color:var(--muted);margin-bottom:20px}
@media(max-width:800px){.co-grid{grid-template-columns:1fr}.co-summary{order:-1}}
</style>
</head>
<body>

<header class="site-header" id="siteHeader">
  <div class="header-inner">
    <a href="index.html" class="logo">Jewelora<span>Craft</span></a>
    <nav class="main-nav" id="mainNav">
      <a href="index.html">Home</a>
      <a href="products.html">Shop</a>
    </nav>
  </div>
</header>

<main class="co-wrap" id="checkoutRoot"></main>

<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script>
const products = DB.getProducts();
let cart = DB.getCart();
const root = document.getElementById("checkoutRoot");

function cartLines() {
  return cart.map(c => {
    const p = products.find(p => p.id === c.id);
    return p ? { c, p } : null;
  }).filter(Boolean);
}
function cartTotal() { return cartLines().reduce((s, { c, p }) => s + p.discountPrice * c.qty, 0); }

function renderEmpty() {
  root.innerHTML = `<div class="co-empty">
    <h2>Your bag is empty</h2>
    <p>Add something beautiful before checking out.</p>
    <a class="btn btn-gold" href="products.html">Browse the Shop</a></div>`;
}

function render() {
  const lines = cartLines();
  if (lines.length === 0) return renderEmpty();
  root.innerHTML = `
    <a class="co-back" href="products.html">← Continue shopping</a>
    <h1 class="co-title">Checkout</h1>
    <div class="co-grid">
      <div class="co-card">
        <h3>Delivery Details</h3>
        <form id="checkoutForm">
          <label>Full Name<input type="text" id="custName" required maxlength="120" autocomplete="name"></label>
          <label>Phone<input type="tel" id="custPhone" required maxlength="40" autocomplete="tel"></label>
          <label>Address<textarea id="custAddress" required rows="3" maxlength="400" autocomplete="street-address"></textarea></label>
          <button type="submit" class="btn btn-gold btn-block" id="placeBtn">Place Order</button>
          <p class="co-note">Payment: Cash on Delivery</p>
        </form>
      </div>
      <div class="co-card co-summary">
        <h3>Order Summary</h3>
        ${lines.map(({ c, p }) => `
          <div class="co-item">
            <img src="${p.image}" alt="${esc(p.name)}">
            <div class="info">${esc(p.name)}
              ${c.size ? `<div class="sub">${esc(c.size)}</div>` : ""}
              <div class="sub">${c.qty} × ${fmt(p.discountPrice)}</div>
            </div>
            <div class="line">${fmt(p.discountPrice * c.qty)}</div>
          </div>`).join("")}
        <div class="co-total"><span>Total</span><span>${fmt(cartTotal())}</span></div>
      </div>
    </div>`;
  document.getElementById("checkoutForm").addEventListener("submit", placeOrder);
}

function placeOrder(e) {
  e.preventDefault();
  const lines = cartLines();
  if (lines.length === 0) return renderEmpty();
  const btn = document.getElementById("placeBtn");
  btn.disabled = true; btn.textContent = "Placing order…";

  const order = {
    id: uid("ORD"),
    date: new Date().toISOString(),
    customer: {
      name: document.getElementById("custName").value.trim(),
      phone: document.getElementById("custPhone").value.trim(),
      address: document.getElementById("custAddress").value.trim(),
    },
    items: lines.map(({ c, p }) => ({ id: c.id, name: p.name, size: c.size, qty: c.qty, price: p.discountPrice })),
    total: cartTotal(),
    status: "pending",
  };

  const orders = DB.getOrders();
  orders.unshift(order);
  DB.setOrders(orders);

  // Email notification (Resend key stays on the server in /api/notify)
  try {
    fetch("/api/notify", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ type: "order", order }),
    }).catch(() => {});
  } catch (_) {}

  cart = [];
  DB.setCart(cart);

  root.innerHTML = `<div class="co-empty">
    <h2>Thank you, order placed! ✨</h2>
    <p>Your order ID is <b>${esc(order.id)}</b>.<br>We'll contact you shortly to confirm delivery.</p>
    <a class="btn btn-gold" href="index.html">Back to Home</a></div>`;
  window.scrollTo(0, 0);
}

render();
</script>
</body>
</html>
